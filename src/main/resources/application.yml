spring:
  application:
    name: auctions
  config:
    import: "optional:configserver:http://localhost:18071/"
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:h2:mem:auctiondb;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
  cloud:
    bus:
      enabled: false
    stream:
      bindings:
        auctionStarted-out-0:
          destination: auction-started
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  show-spring-cloud-functions: false

